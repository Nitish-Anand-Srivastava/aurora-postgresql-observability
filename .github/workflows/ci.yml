name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Run full validation suite
        # Runs YAML/JSON syntax, Grafana dashboard structure + metric provenance, Prometheus
        # config/rules/unit tests (promtool v3.14.0, downloaded on demand), database-role
        # consistency, a shell linter, Markdown link checking, and a secret-pattern scan.
        # See scripts/validate.py.
        run: python scripts/validate.py

  actionlint:
    name: Lint GitHub Actions workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  yamllint:
    name: Lint YAML (yamllint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run yamllint
        uses: reviewdog/action-yamllint@v1.23.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          fail_level: error
          yamllint_flags: "--no-warnings ."

  shellcheck:
    name: Lint shell scripts (shellcheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run shellcheck
        # This repository ships no .sh/.bash scripts today; this step is a no-op until one is
        # added, and then automatically lints it.
        uses: reviewdog/action-shellcheck@v1.32.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          fail_level: error

  markdownlint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: |
            **/*.md

  gitleaks:
    name: Scan for committed secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only required for GitHub Organizations, not personal accounts/repos. Leaving this
          # secret unset in a personal-account repo is fine and does not disable scanning.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
