# Prometheus scrape configuration used ONLY by the local Docker Compose validation stack
# (docker/docker-compose.yml). Unlike prometheus/prometheus.yml (the production reference
# template, which uses placeholder .invalid hostnames), this file targets the actual Docker
# Compose service DNS names on the compose-internal network, so `docker compose up` produces a
# fully working, self-contained scrape/dashboard demo without any real Aurora/AWS endpoint.
#
# It intentionally reuses the same rule files as production so `make validate` /
# `promtool check rules` exercise the real rules.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "local-validation"

rule_files:
  - "/etc/prometheus/rules/recording_rules.yml"
  - "/etc/prometheus/rules/alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "postgres_exporter"
    static_configs:
      - targets: ["postgres_exporter:9187"]
        labels:
          cluster: "local-validation"
          instance: "local-postgres"
          role: "writer"

  - job_name: "yace"
    scrape_interval: 60s
    static_configs:
      - targets: ["yace:5000"]
        labels:
          cluster: "local-validation"
