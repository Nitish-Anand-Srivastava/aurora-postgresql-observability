# Optional postgres_exporter configuration file (--config.file).
#
# This file is ONLY needed for the multi-target BETA feature
# (https://github.com/prometheus-community/postgres_exporter#multi-target-support-beta),
# where a single exporter process probes many Postgres targets via `/probe?target=...`.
# That pattern is meant for cases where running the exporter as a sidecar/systemd unit next to
# each database is impossible (e.g. SaaS-managed Postgres). For a self-managed Aurora cluster,
# the recommended and simpler approach — used by default in this repo — is one exporter process
# per instance (or per cluster) using DATA_SOURCE_URI/DATA_SOURCE_USER/DATA_SOURCE_PASS_FILE, with
# `--config.file=""` to disable this file entirely. See systemd/postgres_exporter.service.
#
# If you do need multi-target mode, uncomment and adapt an auth_modules entry below, then point
# Prometheus at the exporter's /probe endpoint with a `target` param (see prometheus/prometheus.yml
# for a documented, commented example job). NEVER put real credentials in this tracked file —
# reference an untracked include or template this file at deploy time instead.
#
# auth_modules:
#   aurora_pg: # arbitrary module name referenced by ?auth_module=aurora_pg
#     type: userpass
#     userpass:
#       username: pg_exporter
#       password: "REPLACE_AT_DEPLOY_TIME_DO_NOT_COMMIT"
#     options:
#       sslmode: verify-full
