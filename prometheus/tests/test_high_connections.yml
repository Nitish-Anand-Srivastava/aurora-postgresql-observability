# promtool unit test: AuroraPostgresHighConnections{,Critical} (prometheus/rules/alerts.yml).
# See test_instance_down.yml for why each alert category is its own file.
rule_files:
  - ../rules/recording_rules.yml
  - ../rules/alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: "pg_stat_activity_count{cluster=\"test-cluster\",\
          instance=\"aurora-writer.observability.invalid:9187\",datname=\"postgres\",state=\"active\",\
          usename=\"postgres_exporter\",application_name=\"\",backend_type=\"client backend\",\
          wait_event_type=\"\",wait_event=\"\"}"
        values: "50x2 85x14"
      - series: 'pg_settings_max_connections{cluster="test-cluster",instance="aurora-writer.observability.invalid:9187"}'
        values: "100x17"
    promql_expr_test:
      - expr: aurora:connections_used_ratio
        eval_time: 5m
        exp_samples:
          - labels: 'aurora:connections_used_ratio{cluster="test-cluster",instance="aurora-writer.observability.invalid:9187"}'
            value: 0.85
    alert_rule_test:
      # "50x2" is 3 samples (t=0,1,2) of 50, then "85x14" is 15 samples (t=3..17) of 85 --
      # promtool's `<val>x<n>` series syntax repeats the value n+1 times in total. Ratio crosses
      # 0.8 at t=3m; "for: 10m" fires at t=13m.
      - eval_time: 12m
        alertname: AuroraPostgresHighConnections
        exp_alerts: []
      - eval_time: 13m
        alertname: AuroraPostgresHighConnections
        exp_alerts:
          - exp_labels:
              severity: warning
              service: aurora-postgresql
              cluster: test-cluster
              instance: aurora-writer.observability.invalid:9187
            exp_annotations:
              summary: "aurora-writer.observability.invalid:9187 is using 85% of max_connections"
              runbook_url: "https://github.com/Nitish-Anand-Srivastava/aurora-postgresql-observability/blob/main/docs/troubleshooting.md#aurorapostgreshighconnections"
              description: >-
                Connection count has exceeded 80% of pg_settings_max_connections for 10 minutes on
                aurora-writer.observability.invalid:9187. New connections risk being rejected with
                "FATAL: too many connections".
