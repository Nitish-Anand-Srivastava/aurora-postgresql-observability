# promtool unit test: AuroraPostgresReplicaLagHigh (prometheus/rules/alerts.yml).
# Kept in its own file (separate from the Critical variant) so each promtool process invocation
# tests exactly one alertname -- see test_instance_down.yml for background on why each scenario
# gets its own file, and check_prometheus.py for why each file is run as its own promtool process.
rule_files:
  - ../rules/recording_rules.yml
  - ../rules/alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'pg_replication_lag_seconds{cluster="test-cluster",instance="aurora-reader1.observability.invalid:9187"}'
        values: "0x2 150x10"
    alert_rule_test:
      # "0x2" is 3 samples (t=0,1,2) of 0, then "150x10" is 11 samples (t=3..13) of 150. Lag
      # crosses the 30s threshold at t=3m; "for: 5m" fires at t=8m.
      - eval_time: 7m
        alertname: AuroraPostgresReplicaLagHigh
        exp_alerts: []
      - eval_time: 8m
        alertname: AuroraPostgresReplicaLagHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              service: aurora-postgresql
              cluster: test-cluster
              instance: aurora-reader1.observability.invalid:9187
            exp_annotations:
              summary: "Replica aurora-reader1.observability.invalid:9187 is 150s behind the writer"
              runbook_url: "https://github.com/Nitish-Anand-Srivastava/aurora-postgresql-observability/blob/main/docs/troubleshooting.md#aurorapostgresreplicalaghigh"
              description: >-
                pg_replication_lag_seconds has exceeded 30 seconds for 5 minutes on
                aurora-reader1.observability.invalid:9187. Read traffic served by this reader may
                return stale data.
